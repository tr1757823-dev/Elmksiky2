

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" value="0" readonly>
        <div class="buttons">
            <button id="clear" class="clear">AC</button>
            <button id="del">DEL</button>
            <button id="mod">%</button>
            <button id="div" class="operator">/</button>

            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>
            <button id="mult" class="operator">*</button>

            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>
            <button id="min" class="operator">-</button>

            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button>
            <button id="plus" class="operator">+</button>

            <button id="00">00</button>
            <button id="0">0</button>
            <button id="dot">.</button>
            <button id="equal" class="equal">=</button>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
